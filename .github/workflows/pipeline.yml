name: Wellness Tourism End-to-End MLOps Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - "models/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mlops-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Data Validation & Registration
        run: python src/data_validation.py

      - name: Data Preprocessing
        run: python src/data_prep.py

      - name: Model Training & Evaluation
        run: python src/train.py

      - name: Model Registration
        run: python src/register_model.py

      - name: Push Pipeline Outputs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "ci: update ML pipeline outputs [skip ci]"
            git push origin main
          fi
